[project]
name = "modelforge"
version = "2.0.0"
description = "ModelForge — turn trained ML models (.pkl) into production APIs with keys, dashboards and real-time telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ModelForge Contributors" }]
keywords = ["machine-learning", "mlops", "fastapi", "model-serving", "inference-api"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Pinned, integration-tested dependency set (see requirements.txt for the exact
# freeze used in CI). pandas is intentionally optional: only pipelines that
# embed pandas objects require it.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "scikit-learn==1.9.0",
  "joblib==1.6.0",
  "numpy==2.2.4",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
dev = [
  "pytest==9.0.2",
  "httpx>=0.27",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/modelforge/modelforge"
Documentation = "https://github.com/modelforge/modelforge#readme"
Changelog = "https://github.com/modelforge/modelforge/blob/main/CHANGELOG.md"

[project.scripts]
modelforge = "backend.main:run"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
  "slow: tests that train real estimators (a few seconds each)",
]
filterwarnings = [
  "ignore::DeprecationWarning:websockets.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["frontend", "demo_models", "state", "backend/pkl_storage"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
  "S101",   # assert usage — required by pytest
  "B008",   # FastAPI Header()/Query() defaults in signatures are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
