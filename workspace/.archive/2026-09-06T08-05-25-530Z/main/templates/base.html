<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ML Model Uploader{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header class="topbar">
    <div class="logo">🌿 ML Model Hub</div>
    <nav>
      <a href="/">Home</a>
      <a href="/upload">Upload</a>
      <a href="/models">Models</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
    </nav>
  </header>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      function current() {
        return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      }
      function sync() {
        btn.textContent = current() === "dark" ? "☀️" : "🌙";
      }
      sync();
      btn.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        sync();
      });
    })();
  </script>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Kartheek's ML Model Hub · FastAPI + HTMX + Jinja2</footer>
</body>
</html>
